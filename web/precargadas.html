<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#050c16">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Etiquetador">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icons/icon-192.png">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <title>EtiquetadorZPL - Etiquetas precargadas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="panel.css">
    <link rel="stylesheet" href="panel-mobile.css">
    <style>
        .file-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 8px; }
        .file { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius-md); padding: 10px 12px; display: flex; gap: 10px; align-items: center; justify-content: space-between; min-width: 0; }
        .file-name { min-width: 0; overflow-wrap: anywhere; }
        .file-name strong { display: block; font-size: 0.95rem; }
        .file-name span { display: block; color: var(--text-1); font-size: 0.82rem; line-height: 1.25; }
        .file .actions { flex-shrink: 0; flex-wrap: nowrap; }
        .file .btn { min-height: 36px; }
        .dialog-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
        .dialog-grid select, .dialog-grid input { width: 100%; }
        .dialog-status { min-height: 1.2em; margin: 0 0 10px; }
        .meta.ok { color: var(--success); }
        .dialog-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .dialog-actions .btn { width: 100%; min-height: 42px; }
        @media (max-width: 720px) {
            .container { padding: 12px 10px 24px; padding-top: calc(12px + env(safe-area-inset-top, 0px)); }
            nav[aria-label="Paginas"] { display: none; }
            h1 { font-size: 1.3rem; }
            .file-list { grid-template-columns: 1fr; }
            .toolbar input { width: 100%; }
            .toolbar .field { flex: 1 1 100%; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div>
                <h1>Etiquetas precargadas</h1>
                <p class="sub">PDF de la carpeta de Drive de la planilla.</p>
            </div>
            <div class="toolbar">
                <div id="sheet-picker" hidden></div>
                <button class="btn" id="refresh-btn" onclick="loadFiles(true)">Actualizar</button>
            </div>
        </header>

        <nav aria-label="Paginas">
            <a href="hoy.html">Hoy</a>
            <a href="trabajos.html?view=trabajos">Trabajos</a>
            <a href="precargadas.html?view=precargadas" class="active" aria-current="page">Precargadas</a>
            <a href="config.html?view=administrado#administrado">Envios Administrado</a>
            <a href="config.html">Configuracion</a>
            <a href="index.html">Impresion</a>
        </nav>

        <div class="panel">
            <div class="toolbar">
                <label class="field">Buscar
                    <input type="text" id="filter-search" placeholder="Nombre de la etiqueta" oninput="render()">
                </label>
            </div>
            <p class="meta" id="files-meta" role="status" aria-live="polite">Cargando...</p>
        </div>

        <div class="file-list" id="file-list"></div>
    </div>

    <dialog class="state-dialog" id="print-dialog" aria-labelledby="print-dialog-title">
        <h2 id="print-dialog-title">Imprimir etiqueta</h2>
        <p class="muted" id="print-dialog-file"></p>
        <div class="dialog-grid">
            <label class="field">Impresora
                <select id="print-target">
                    <option value="label">Etiquetadora</option>
                    <option value="sheet">Hoja A4 (ordenes)</option>
                </select>
            </label>
            <label class="field">Copias
                <input type="number" id="print-copies" min="1" max="10" value="1">
            </label>
        </div>
        <div class="print-status" id="print-status" role="status" aria-live="polite"></div>
        <div class="dialog-actions">
            <button type="button" class="btn secondary" data-close onclick="this.closest('dialog').close()">Cerrar</button>
            <button type="button" class="btn" id="print-btn" onclick="printSelected()">Imprimir</button>
        </div>
    </dialog>

    <!-- Barra inferior: solo en pantallas chicas (celular). -->
    <nav class="mobile-tabbar" id="mobile-tabbar" aria-label="Secciones">
        <a href="trabajos.html?view=trabajos" data-mobile-view="trabajos">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="3.5" width="16" height="17" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>
            <span>Trabajos</span>
        </a>
        <a href="precargadas.html?view=precargadas" data-mobile-view="precargadas">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 12.5V4.5a1 1 0 0 1 1-1h8l8 8-9 9-8-8z"/><circle cx="8.5" cy="8.5" r="1.5"/></svg>
            <span>Precargadas</span>
        </a>
        <a href="config.html?view=administrado#administrado" data-mobile-view="administrado">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7l9-4 9 4v10l-9 4-9-4V7z"/><path d="M3 7l9 4 9-4M12 11v10"/></svg>
            <span>Envios</span>
        </a>
        <a href="config.html?view=pos#pos-reconciliation-section" data-mobile-view="pos">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="5" width="19" height="14" rx="2"/><path d="M2.5 10h19M6.5 15h4"/></svg>
            <span>Pagos</span>
        </a>
        <button type="button" id="mobile-logout" onclick="logoutMobileSession()" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4h4a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1h-4M10 16l-4-4 4-4M6 12h10"/></svg>
            <span>Salir</span>
        </button>
    </nav>

    <script src="panel-cache.js"></script>
    <script src="config.js"></script>
    <script src="bg-fx.js"></script>
    <script src="panel.js"></script>
    <script src="mobile.js"></script>
    <script src="print-feedback.js"></script>
    <script src="trabajos-sheet.js"></script>
    <script>
        let files = [];
        let printing = null;

        // Los nombres usan "#" para separar el titulo del detalle (igual que el visor de la planilla).
        function splitName(name) {
            const index = name.indexOf('#');
            return index === -1 ? [name, ''] : [name.slice(0, index).trim(), name.slice(index + 1).trim()];
        }

        function render() {
            const search = document.getElementById('filter-search').value.trim().toLowerCase();
            const list = files.filter(file => !search || file.name.toLowerCase().includes(search));
            document.getElementById('file-list').innerHTML = list.length ? list.map(file => {
                const [title, detail] = splitName(file.name);
                return `<div class="file">
                    <div class="file-name"><strong>${esc(title)}</strong>${detail ? `<span>${esc(detail)}</span>` : ''}</div>
                    <div class="actions">
                        <button type="button" class="btn small secondary" data-id="${esc(file.id)}" onclick="viewFile(this.dataset.id)">Ver</button>
                        <button type="button" class="btn small" data-id="${esc(file.id)}" onclick="openPrint(this.dataset.id)">Imprimir</button>
                    </div>
                </div>`;
            }).join('') : '<div class="panel empty">No hay etiquetas con ese nombre</div>';
            const meta = document.getElementById('files-meta');
            meta.className = 'meta';
            meta.textContent = `${list.length} de ${files.length} etiquetas`;
        }

        async function loadFiles(force = false) {
            const btn = document.getElementById('refresh-btn');
            btn.disabled = true;
            try {
                const data = await panelApi(withSheet(`/api/trabajos/preloaded${force ? '?refresh=true' : ''}`));
                files = data.items || [];
                render();
            } catch (error) {
                const meta = document.getElementById('files-meta');
                meta.className = 'meta error';
                meta.textContent = `No se pudo leer la carpeta: ${error.message}`;
            } finally {
                btn.disabled = false;
            }
        }

        async function viewFile(id) {
            // La pestaña se abre con el toque del usuario para que el celular no la bloquee.
            const tab = window.open('', '_blank');
            try {
                const base = await panelApiBaseUrl();
                const response = await fetch(`${base}${withSheet(`/api/trabajos/preloaded/${encodeURIComponent(id)}/pdf`)}`);
                if (!response.ok) {
                    const data = await response.json().catch(() => ({}));
                    throw new Error(data.detail || `HTTP ${response.status}`);
                }
                const url = URL.createObjectURL(await response.blob());
                if (tab) tab.location.href = url;
                else window.location.href = url;
            } catch (error) {
                if (tab) tab.close();
                const meta = document.getElementById('files-meta');
                meta.className = 'meta error';
                meta.textContent = `No se pudo abrir el PDF: ${error.message}`;
            }
        }

        function openPrint(id) {
            printing = files.find(file => file.id === id);
            if (!printing) return;
            document.getElementById('print-dialog-file').textContent = splitName(printing.name).filter(Boolean).join(' · ');
            const status = document.getElementById('print-status');
            status.className = 'print-status';
            status.textContent = '';
            document.getElementById('print-dialog').showModal();
        }

        async function printSelected() {
            if (!printing) return;
            const file = printing;
            const copies = Math.min(10, Math.max(1, parseInt(document.getElementById('print-copies').value, 10) || 1));
            const target = document.getElementById('print-target').value;
            await runWithProgress({
                button: document.getElementById('print-btn'),
                status: document.getElementById('print-status'),
                steps: [
                    'Descargando la etiqueta de Drive...',
                    target === 'sheet' ? 'Enviando a la impresora de ordenes...' : 'Preparando y enviando a la etiquetadora...',
                    'Esperando que la impresora la reciba...',
                ],
                stepMs: 3000,
                task: () => panelApi(withSheet(`/api/trabajos/preloaded/${encodeURIComponent(file.id)}/print`), {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ target, copies }),
                }),
                success: result => `Listo: "${splitName(file.name)[0]}" enviada a ${result.printer}${copies > 1 ? ` (${copies} copias)` : ''}.`,
            });
        }

        document.getElementById('print-dialog').addEventListener('click', (event) => {
            const box = event.currentTarget.getBoundingClientRect();
            const outside = event.clientX < box.left || event.clientX > box.right || event.clientY < box.top || event.clientY > box.bottom;
            if (event.target === event.currentTarget && outside) event.currentTarget.close();
        });

        initSheetPicker(() => {
            files = [];
            render();
            loadFiles();
        }).then(() => loadFiles());
    </script>
</body>
</html>
