<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EtiquetadorZPL - Login</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }
        .logo {
            text-align: center;
            margin-bottom: 30px;
        }
        .logo h1 {
            color: #2c3e50;
            font-size: 2em;
            margin-bottom: 10px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-weight: 500;
        }
        .form-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }
        .btn {
            width: 100%;
            padding: 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
        }
        .btn:hover {
            background: #5a6fd8;
        }
        .error {
            color: #e74c3c;
            text-align: center;
            margin-top: 15px;
            display: none;
        }
        .info {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 5px;
            margin-top: 20px;
            font-size: 14px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <h1>🏷️ EtiquetadorZPL</h1>
            <p>Sistema de Gestión de Etiquetas</p>
        </div>
        
        <form id="loginForm">
            <div class="form-group">
                <label for="username">Usuario:</label>
                <input type="text" id="username" name="username" required>
            </div>
            
            <div class="form-group">
                <label for="password">Contraseña:</label>
                <input type="password" id="password" name="password" required>
            </div>
            
            <button type="submit" class="btn">Iniciar Sesión</button>
            
            <div id="error" class="error">
                Usuario o contraseña incorrectos
            </div>
        </form>
        
        <div class="info">
            <strong>Usuario por defecto:</strong><br>
            Usuario: admin<br>
            Contraseña: admin123
        </div>
    </div>

    <script>
        // Detectar puerto de la API
        async function getApiPort() {
            const ports = [8080, 8002, 8003, 8001];
            
            for (const port of ports) {
                try {
                    const response = await fetch(`http://localhost:${port}/api/status`, { 
                        method: 'GET',
                        timeout: 1000 
                    });
                    if (response.ok) {
                        return port;
                    }
                } catch (e) {
                    continue;
                }
            }
            return 8080;
        }

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('error');
            
            try {
                const port = await getApiPort();
                const response = await fetch(`http://localhost:${port}/api/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ username, password })
                });
                
                if (response.ok) {
                    const data = await response.json();
                    
                    // Guardar sesión
                    localStorage.setItem('cloud_access_token', data.access_token || '');
                    localStorage.setItem('cloud_username', data.username || username);
                    localStorage.setItem('cloud_role', data.role || '');
                    localStorage.setItem('username', data.username || username);
                    localStorage.setItem('role', data.role || '');
                    
                    // Redirigir al dashboard
                    window.location.href = 'config.html#administrado';
                } else {
                    const errorData = await response.json().catch(() => ({}));
                    errorDiv.textContent = errorData.detail || 'Usuario o contrasena incorrectos';
                    errorDiv.style.display = 'block';
                }
            } catch (error) {
                errorDiv.textContent = 'Error de conexión con el servidor';
                errorDiv.style.display = 'block';
            }
        });

        // Auto-completar para demo
        document.getElementById('username').value = 'admin';
        document.getElementById('password').value = 'admin123';
    </script>
</body>
</html>
