<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#050c16">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <title>EtiquetadorZPL - Iniciar sesion</title>
    <style>
        :root {
            color-scheme: dark;
            --bg-0: #050c16;
            --bg-1: #0b1728;
            --panel: rgba(10, 21, 37, 0.86);
            --line: rgba(124, 148, 182, 0.28);
            --text-0: #e6edf8;
            --text-1: #bdd0ea;
            --accent: #42d0c7;
            --accent-strong: #1fb8cf;
            --danger: #ef6a6a;
            --field: rgba(5, 12, 22, 0.7);
        }
        @media (prefers-color-scheme: light) {
            :root {
                color-scheme: light;
                --bg-0: #eef3f9;
                --bg-1: #dfe8f3;
                --panel: rgba(255, 255, 255, 0.92);
                --line: rgba(60, 84, 120, 0.22);
                --text-0: #0f1d30;
                --text-1: #3d5372;
                --accent: #0f9e96;
                --accent-strong: #0b8aa0;
                --danger: #c93c3c;
                --field: #ffffff;
            }
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Manrope', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: var(--text-0);
            background:
                radial-gradient(900px 600px at 80% -10%, rgba(66, 208, 199, 0.16), transparent 60%),
                linear-gradient(160deg, var(--bg-0) 0%, var(--bg-1) 100%);
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        .login-card {
            width: 100%;
            max-width: 380px;
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 16px;
            padding: 28px 22px;
            box-shadow: 0 20px 60px rgba(1, 6, 14, 0.35);
        }
        .kicker {
            font-size: 12px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--accent);
            font-weight: 700;
        }
        h1 { font-size: 22px; margin: 6px 0 4px; }
        .sub { color: var(--text-1); font-size: 14px; margin-bottom: 22px; }
        label { display: block; font-size: 13px; font-weight: 600; color: var(--text-1); margin-bottom: 6px; }
        input {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid var(--line);
            background: var(--field);
            color: var(--text-0);
            font-size: 16px; /* 16px evita el zoom automatico en iPhone */
            margin-bottom: 16px;
        }
        input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, var(--accent), var(--accent-strong));
            color: #04121a;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }
        button:disabled { opacity: 0.6; cursor: wait; }
        .error { color: var(--danger); font-size: 14px; margin-top: 14px; min-height: 1.2em; text-align: center; }
    </style>
</head>
<body>
    <main class="login-card">
        <p class="kicker">EtiquetadorZPL</p>
        <h1>Iniciar sesion</h1>
        <p class="sub">Para usar la app desde fuera de la oficina.</p>
        <form id="login-form">
            <label for="username">Usuario</label>
            <input type="text" id="username" name="username" autocomplete="username" autocapitalize="none" required>
            <label for="password">Contrasena</label>
            <input type="password" id="password" name="password" autocomplete="current-password" required>
            <button type="submit" id="login-submit">Entrar</button>
            <p id="login-error" class="error" role="alert"></p>
        </form>
    </main>

    <script>
        // Mismas claves que cloud.html: una sola sesion para toda la app.
        const TOKEN_KEY = 'cloud_access_token';
        const USER_KEY = 'cloud_username';
        const ROLE_KEY = 'cloud_role';
        const DEFAULT_NEXT = 'config.html?view=administrado#administrado';

        // Solo se vuelve a paginas de esta misma app (nada de "//otro-sitio" ni "https:").
        function safeNext() {
            const next = new URLSearchParams(window.location.search).get('next') || '';
            return /^[a-z0-9_-]+\.html([?#].*)?$/i.test(next) ? next : DEFAULT_NEXT;
        }

        document.getElementById('login-form').addEventListener('submit', async (event) => {
            event.preventDefault();
            const submit = document.getElementById('login-submit');
            const errorEl = document.getElementById('login-error');
            errorEl.textContent = '';
            submit.disabled = true;
            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: document.getElementById('username').value.trim(),
                        password: document.getElementById('password').value
                    })
                });
                const data = await response.json().catch(() => ({}));
                if (!response.ok || !data.access_token) {
                    throw new Error(data.detail || 'Usuario o contrasena incorrectos');
                }
                try {
                    localStorage.setItem(TOKEN_KEY, data.access_token);
                    localStorage.setItem(USER_KEY, data.username || '');
                    localStorage.setItem(ROLE_KEY, data.role || '');
                } catch (e) {
                    throw new Error('El navegador no permite guardar la sesion (modo privado?)');
                }
                window.location.replace(safeNext());
            } catch (error) {
                errorEl.textContent = error.message === 'Failed to fetch'
                    ? 'No se pudo conectar con el servidor'
                    : error.message;
                submit.disabled = false;
            }
        });
    </script>
</body>
</html>
